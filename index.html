<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Fun – aprenda inglês brincando</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sky" aria-hidden="true"><span style="--x:6%;--y:14%;--d:0s">☁️</span><span style="--x:68%;--y:9%;--d:-6s">☁️</span><span style="--x:88%;--y:34%;--d:-3s">🎈</span><span style="--x:2%;--y:58%;--d:-9s">🦋</span><span style="--x:91%;--y:64%;--d:-12s">⭐</span></div>
<div class="hills" aria-hidden="true">🌳 🌷 🏡 🌷 🌳 🌷 🌳</div>
<header>
  <a class="brand" href="#" onclick="return false">🦉 English Fun</a>
  <div class="who" id="who" hidden><span class="av" id="av"></span><b id="nm"></b><span class="pill" title="Suas estrelas">⭐ <b id="stars">0</b></span><button class="btn out" id="out">Sair</button></div>
</header>
<main>
  <section id="auth" hidden>
    <div class="card auth">
      <div class="owl" aria-hidden="true">🦉</div>
      <h1 class="logo" aria-label="English Fun"></h1>
      <div class="tabs"><button class="tab on" data-t="in">Entrar</button><button class="tab" data-t="up">Criar conta</button></div>
      <form id="f" autocomplete="off">
        <label>Seu nome<input id="un" maxlength="12" required placeholder="ex.: Ana2015"></label>
        <label>Senha<input id="pw" type="password" required placeholder="mínimo 4 caracteres"></label>
        <div id="avs" hidden><span>Escolha seu amigo:</span><div class="avl"></div></div>
        <p class="err" id="err" role="alert"></p>
        <button class="go" id="sub">Entrar</button>
      </form>
      <button class="btn guest" id="guest">Jogar sem conta</button>
    </div>
  </section>
  <section id="home" hidden>
    <h1 class="logo" aria-label="English Fun"></h1>
    <p class="sub">Aprenda inglês brincando!</p>
    <div class="hero">
      <div class="owl" aria-hidden="true">🦉</div>
      <div class="card bubble"><b id="hi">Hello!</b> Escolha um jogo, junte estrelas e aprenda palavras novas em inglês.</div>
    </div>
    <div class="tiles">
      <button class="tile" data-g="tr"><i>🔤</i><b>Traduza a palavra</b><small>Ouça e escolha o significado</small><em class="play">Jogar ▶</em></button>
      <button class="tile" data-g="pic"><i>🖼️</i><b>Que figura é essa?</b><small>Descubra o nome em inglês</small><em class="play">Jogar ▶</em></button>
      <button class="tile" data-g="ws"><i>🔎</i><b>Caça-palavras</b><small>Arraste o dedo sobre as letras</small><em class="play">Jogar ▶</em></button>
      <button class="tile" data-g="mem"><i>🃏</i><b>Jogo da memória</b><small>Una a figura à palavra</small><em class="play">Jogar ▶</em></button>
    </div>
  </section>
  <section id="app" hidden></section>
</main>
<script src="script.js"></script>
</body>
</html>
